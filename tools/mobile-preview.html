<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mobile preview</title>
<style>body{margin:0;background:#222;display:flex;gap:24px;padding:24px;align-items:flex-start}
iframe{width:375px;height:812px;border:0;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
</style></head><body>
<iframe id="f"></iframe><script>document.getElementById("f").src="../index.html?mp="+Date.now();</script>
<script>window.go=(y)=>{const w=document.getElementById('f').contentWindow; w.document.documentElement.style.scrollBehavior='auto'; w.scrollTo(0,y); return w.scrollY};</script>
</body></html>
